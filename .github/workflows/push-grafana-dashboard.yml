# Run manually: Actions → "Push Grafana dashboard" → Run workflow
# Also runs on push to main when files under neon-loader/grafana/ change.
# Required repository Secrets: GRAFANA_URL, GRAFANA_TOKEN, GRAFANA_DATASOURCE_UID
# (Settings → Secrets and variables → Actions)

name: Push Grafana dashboard

on:
  workflow_dispatch:
    inputs:
      dashboard:
        description: "Path under neon-loader (e.g. grafana/dashboard.utilities-ops-hud.json)"
        required: true
        default: "grafana/dashboard.utilities-citizen.json"
        type: string
  push:
    branches:
      - main
      - acquisuite-ingest
    paths:
      - "neon-loader/grafana/**"

jobs:
  push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: neon-loader
    env:
      GRAFANA_URL: ${{ secrets.GRAFANA_URL }}
      GRAFANA_TOKEN: ${{ secrets.GRAFANA_TOKEN }}
      GRAFANA_DATASOURCE_UID: ${{ secrets.GRAFANA_DATASOURCE_UID }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Must be string '0' — numeric 0 is falsy in GitHub expressions and becomes fetch-depth 1.
          fetch-depth: ${{ github.event_name == 'push' && '0' || '1' }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Push dashboard(s)
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            node scripts/push-grafana-dashboard.mjs --dashboard "${{ inputs.dashboard }}"
            exit 0
          fi
          before="${{ github.event.before }}"
          after="${{ github.sha }}"
          # Job working-directory is neon-loader/; git pathspec must be grafana/ not neon-loader/grafana/.
          if [ "$before" = "0000000000000000000000000000000000000000" ]; then
            changed="$(git show --name-only --pretty=format: "$after" -- grafana/ | grep -E '\.json$' || true)"
          else
            changed="$(git diff --name-only "$before" "$after" -- grafana/ | grep -E '\.json$' || true)"
          fi
          if [ -z "$changed" ]; then
            echo "No dashboard JSON in this push; skipping."
            exit 0
          fi
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            rel="${path#neon-loader/}"
            echo "Pushing ${rel} ..."
            node scripts/push-grafana-dashboard.mjs --dashboard "$rel"
          done <<< "$changed"
